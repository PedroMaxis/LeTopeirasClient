<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>LeTopeiras · Login</title>
    <!-- Mockup de referência (1280x800). Não é código de produção: serve de guia visual. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap"
    />
    <style>
      body {
        margin: 0;
      }
      a {
        color: #f5a26a;
      }
      a:hover {
        color: #ffc597;
      }
      .soil {
        background-color: #16100c;
        background-image: radial-gradient(#2b1f17 1.6px, transparent 1.7px);
        background-size: 20px 20px;
      }
    </style>
    <style>
      html,
      body {
        background: #0e0a08;
      }
      body {
        display: flex;
        justify-content: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 1280px;
        height: 800px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #2a201a;
        color: #efe3d6;
        font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
      "
    >
      <div
        style="
          height: 30px;
          flex: none;
          background: #16100c;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-left: 12px;
        "
      >
        <div style="display: flex; align-items: center; gap: 6px">
          <svg
            width="18"
            height="18"
            viewBox="0 0 64 64"
            aria-hidden="true"
            style="flex: none; display: block"
          >
            <ellipse cx="18" cy="56" rx="7" ry="4.5" fill="#e9b58c"></ellipse>
            <ellipse cx="46" cy="56" rx="7" ry="4.5" fill="#e9b58c"></ellipse>
            <circle cx="32" cy="37" r="20" fill="#6e4a33"></circle>
            <ellipse cx="32" cy="46" rx="11.5" ry="8.5" fill="#b0805d"></ellipse>
            <circle cx="24.5" cy="35" r="2.2" fill="#1c120b"></circle>
            <circle cx="39.5" cy="35" r="2.2" fill="#1c120b"></circle>
            <ellipse cx="32" cy="41" rx="5" ry="3.6" fill="#f08f8f"></ellipse>
            <rect x="29.2" y="45" width="2.6" height="4.6" rx="0.8" fill="#fff5ea"></rect>
            <rect x="32.2" y="45" width="2.6" height="4.6" rx="0.8" fill="#fff5ea"></rect>
            <path d="M14 28a18 16.5 0 0 1 36 0z" fill="#f0782a"></path>
            <rect x="10" y="26" width="44" height="5" rx="2.5" fill="#c95c18"></rect>
            <circle
              cx="32"
              cy="19"
              r="5"
              fill="#ffe08a"
              stroke="#1c120b"
              stroke-width="2"
            ></circle></svg
          ><span
            style="
              font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
              font-size: 13px;
              font-weight: 800;
              color: #efe3d6;
            "
            >LeTopeiras</span
          ><span style="font-size: 11px; font-weight: 700; color: #b8a693; letter-spacing: 0.08em"
            >CLIENT</span
          >
        </div>
        <div style="display: flex">
          <button
            type="button"
            aria-label="Minimizar"
            style="
              width: 44px;
              height: 30px;
              border: none;
              background: transparent;
              color: #b8a693;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
            </svg>
          </button>
          <button
            type="button"
            aria-label="Maximizar"
            style="
              width: 44px;
              height: 30px;
              border: none;
              background: transparent;
              color: #b8a693;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="5" y="5" width="14" height="14" rx="1"></rect>
            </svg>
          </button>
          <button
            type="button"
            aria-label="Fechar para a bandeja"
            style="
              width: 44px;
              height: 30px;
              border: none;
              background: transparent;
              color: #b8a693;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </div>
      </div>
      <div
        class="soil"
        style="flex: 1; display: flex; align-items: center; justify-content: center"
      >
        <div
          style="
            width: 480px;
            box-sizing: border-box;
            background: #2a201a;
            border-radius: 16px;
            border: 2px solid #3e2f25;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 8px;
              text-align: center;
            "
          >
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
              <svg
                width="96"
                height="96"
                viewBox="0 0 64 64"
                aria-hidden="true"
                style="flex: none; display: block"
              >
                <ellipse cx="18" cy="56" rx="7" ry="4.5" fill="#e9b58c"></ellipse>
                <ellipse cx="46" cy="56" rx="7" ry="4.5" fill="#e9b58c"></ellipse>
                <circle cx="32" cy="37" r="20" fill="#6e4a33"></circle>
                <ellipse cx="32" cy="46" rx="11.5" ry="8.5" fill="#b0805d"></ellipse>
                <circle cx="24.5" cy="35" r="2.2" fill="#1c120b"></circle>
                <circle cx="39.5" cy="35" r="2.2" fill="#1c120b"></circle>
                <ellipse cx="32" cy="41" rx="5" ry="3.6" fill="#f08f8f"></ellipse>
                <rect x="29.2" y="45" width="2.6" height="4.6" rx="0.8" fill="#fff5ea"></rect>
                <rect x="32.2" y="45" width="2.6" height="4.6" rx="0.8" fill="#fff5ea"></rect>
                <path d="M14 28a18 16.5 0 0 1 36 0z" fill="#f0782a"></path>
                <rect x="10" y="26" width="44" height="5" rx="2.5" fill="#c95c18"></rect>
                <circle
                  cx="32"
                  cy="19"
                  r="5"
                  fill="#ffe08a"
                  stroke="#1c120b"
                  stroke-width="2"
                ></circle>
              </svg>
              <div
                style="
                  font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
                  font-size: 30px;
                  font-weight: 800;
                  color: #f0782a;
                  letter-spacing: -0.02em;
                  line-height: 1;
                "
              >
                LeTopeiras
              </div>
            </div>
            <h1
              style="
                margin: 8px 0 0;
                color: #fff5ea;
                font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
                font-size: 22px;
                font-weight: 700;
              "
            >
              Bem-vindo de volta à toca!
            </h1>
            <div style="color: #b8a693; font-size: 15px">Entra aí, a galera tá esperando.</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label
              for="usuário"
              style="color: #b8a693; font-size: 12px; font-weight: 800; letter-spacing: 0.04em"
              >USUÁRIO <span style="color: #f23f43">*</span></label
            >
            <input
              id="usuário"
              type="text"
              placeholder="seu_usuario"
              style="
                height: 40px;
                box-sizing: border-box;
                border: none;
                border-radius: 4px;
                background: #16100c;
                color: #efe3d6;
                padding: 0 12px;
                font: inherit;
                font-size: 15px;
              "
            />
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label
              for="senha"
              style="color: #b8a693; font-size: 12px; font-weight: 800; letter-spacing: 0.04em"
              >SENHA <span style="color: #f23f43">*</span></label
            >
            <input
              id="senha"
              type="password"
              placeholder="••••••••"
              style="
                height: 40px;
                box-sizing: border-box;
                border: none;
                border-radius: 4px;
                background: #16100c;
                color: #efe3d6;
                padding: 0 12px;
                font: inherit;
                font-size: 15px;
              "
            />
          </div>
          <div
            style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #b8a693"
          >
            <input
              id="lembrar"
              type="checkbox"
              checked
              style="width: 18px; height: 18px; margin: 0"
            /><label for="lembrar">Manter conectado neste PC</label>
          </div>
          <button
            type="button"
            style="
              height: 44px;
              border: none;
              border-radius: 4px;
              background: #f0782a;
              color: #1c120b;
              font: inherit;
              font-size: 15px;
              font-weight: 800;
              cursor: pointer;
            "
          >
            Entrar na toca
          </button>
          <div style="font-size: 14px; color: #b8a693">
            Tem um código de convite? <a href="Registro.dc.html">Criar conta</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
